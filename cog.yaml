build:
  gpu: false
  # Remove CUDA version as it's not applicable
  python_version: "3.10"
  run:
    # Create only the .assets/models directory
    - mkdir -p .assets/models
    # Install PyTorch with MPS (Metal) support instead of CUDA
    - pip install torch torchvision --extra-index-url https://download.pytorch.org/whl/nightly/cpu
  python_packages:
    - "onnxruntime==1.15.0"  # Regular version instead of GPU
    - "insightface==0.7.3"
    - "opencv-python==4.8.0.76"
    - "numpy==1.24.3"
    - "onnx==1.14.0"
    - "ffmpeg-python==0.2.0"
    - "tqdm==4.66.1"
    - "gfpgan==1.3.8"
    - "pyyaml>=6.0"
    - "scipy==1.10.1"
    - "filetype==1.2.0"
    - "requests>=2.28.0"
  system_packages:
    - ffmpeg
    # Remove Linux-specific packages that don't exist on macOS
    # Add any macOS-specific dependencies if needed
predict: "predict.py:Predictor"