build:
 gpu: true
 cuda: "11.8"
 python_version: "3.10"
 run:
   # Create only the .assets/models directory
   - mkdir -p .assets/models
   # Install PyTorch with CUDA support
   - pip install torch==2.0.0+cu118 torchvision==0.15.1+cu118 --extra-index-url https://download.pytorch.org/whl/cu118
 python_packages:
   - "onnxruntime-gpu==1.15.0"
   - "insightface==0.7.3"
   - "opencv-python==4.8.0.76"
   - "numpy==1.24.3"
   - "onnx==1.14.0"
   - "ffmpeg-python==0.2.0"
   - "tqdm==4.66.1"
   - "gfpgan==1.3.8"
   - "pyyaml>=6.0"
   - "scipy==1.10.1"
   - "filetype==1.2.0"
   - "requests>=2.28.0"  # Added for downloading models in setup()
 system_packages:
   - ffmpeg
   - libsm6
   - libxext6
   - curl
   - git
   - libgl1-mesa-glx
   - libglib2.0-0
predict: "predict.py:Predictor"
